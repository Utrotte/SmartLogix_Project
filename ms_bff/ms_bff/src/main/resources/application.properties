spring.application.name=ms-bff
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/smartlogix_bff_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.openfeign.circuitbreaker.enabled=true

smartlogix.security.session-duration-minutes=120

logging.level.com.smartlogix.bff=DEBUG
