spring.application.name=ms-catalogo-productos
server.port=8086

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3308}/bd_catalogo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Configuración Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
