spring.application.name=ms-usuarios-acceso
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3308}/bd_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

smartlogix.jwt.secret=${JWT_SECRET}
smartlogix.jwt.expiration-minutes=120

management.endpoints.web.exposure.include=health,info
