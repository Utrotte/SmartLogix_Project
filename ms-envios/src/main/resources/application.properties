# ---- Configuración del microservicio ----
spring.application.name=ms-envios
server.port=8083

# ---- Conexión MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3308/smartlogix_envios_db?useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" crea o modifica las tablas al iniciar — cambiar a "validate" en producción
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Eureka — registro de servicio ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
